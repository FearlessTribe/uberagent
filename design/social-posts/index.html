  <script>
    const gallery = document.getElementById("gallery");
    const soloStage = document.getElementById("solo-stage");
    const jump = document.getElementById("jump");
    const tpl = document.getElementById("boards");
    const boards = [...tpl.content.querySelectorAll(".board")];
    let index = 0;

    boards.forEach((board, i) => {
      const wrap = document.createElement("div");
      const thumb = document.createElement("div");
      thumb.className = "thumb";
      thumb.tabIndex = 0;
      thumb.dataset.index = String(i);
      const clone = board.cloneNode(true);
      thumb.appendChild(clone);
      const meta = document.createElement("p");
      meta.className = "card-meta";
      meta.innerHTML = `<strong>${board.dataset.id} · ${board.dataset.title}</strong>1080 × 1350 · 4:5`;
      wrap.appendChild(thumb);
      wrap.appendChild(meta);
      gallery.appendChild(wrap);

      const opt = document.createElement("option");
      opt.value = board.dataset.id;
      opt.textContent = `${board.dataset.id} · ${board.dataset.title}`;
      jump.appendChild(opt);

      const open = () => openSolo(i);
      thumb.addEventListener("click", open);
      thumb.addEventListener("keydown", (e) => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
      });
    });

    function fitBoard() {
      const board = soloStage.querySelector(".board");
      if (!board || document.body.classList.contains("exporting")) {
        if (board) {
          board.style.transform = "";
          board.style.marginRight = "";
          board.style.marginBottom = "";
        }
        return;
      }
      const padX = 32;
      const padY = 96;
      const scale = Math.min(1, (window.innerWidth - padX) / 1080, (window.innerHeight - padY) / 1350);
      board.style.transformOrigin = "top left";
      board.style.transform = `scale(${scale})`;
      board.style.marginRight = `${(scale - 1) * 1080}px`;
      board.style.marginBottom = `${(scale - 1) * 1350}px`;
    }

    function openSolo(i) {
      index = (i + boards.length) % boards.length;
      const board = boards[index].cloneNode(true);
      soloStage.replaceChildren(board);
      document.body.classList.add("solo");
      document.body.classList.remove("clean");
      document.getElementById("s-id").textContent = boards[index].dataset.id;
      history.replaceState(null, "", `#${boards[index].dataset.id}`);
      fitBoard();
    }

    function closeSolo() {
      document.body.classList.remove("solo", "clean", "exporting");
      soloStage.replaceChildren();
      history.replaceState(null, "", location.pathname);
    }

    function fromHash() {
      const id = location.hash.replace("#", "");
      const i = boards.findIndex((b) => b.dataset.id === id);
      if (i >= 0) openSolo(i);
      else closeSolo();
    }

    function slugFor(board) {
      return board.dataset.title.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
    }

    async function exportBoard(board, filename) {
      document.body.classList.add("exporting", "clean");
      const prev = {
        transform: board.style.transform,
        marginRight: board.style.marginRight,
        marginBottom: board.style.marginBottom,
      };
      board.style.transform = "none";
      board.style.marginRight = "0";
      board.style.marginBottom = "0";
      await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
      const dataUrl = await window.htmlToImage.toPng(board, {
        width: 1080,
        height: 1350,
        pixelRatio: 2,
        cacheBust: true,
        style: { transform: "none", marginRight: "0px", marginBottom: "0px" },
      });
      board.style.transform = prev.transform;
      board.style.marginRight = prev.marginRight;
      board.style.marginBottom = prev.marginBottom;
      document.body.classList.remove("exporting");
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      a.click();
      fitBoard();
    }

    async function exportCurrent() {
      const board = soloStage.querySelector(".board");
      if (!board) return;
      await exportBoard(board, `uberagent-${boards[index].dataset.id}-${slugFor(boards[index])}.png`);
    }

    async function exportAll() {
      const btn = document.getElementById("s-export-all");
      btn.disabled = true;
      if (!document.body.classList.contains("solo")) openSolo(0);
      for (let i = 0; i < boards.length; i += 1) {
        openSolo(i);
        await new Promise((r) => setTimeout(r, 120));
        await exportCurrent();
      }
      btn.disabled = false;
    }

    document.getElementById("solo-btn").addEventListener("click", () => openSolo(index));
    document.getElementById("prev").addEventListener("click", () => openSolo(index - 1));
    document.getElementById("next").addEventListener("click", () => openSolo(index + 1));
    document.getElementById("s-prev").addEventListener("click", () => openSolo(index - 1));
    document.getElementById("s-next").addEventListener("click", () => openSolo(index + 1));
    document.getElementById("s-export").addEventListener("click", () => exportCurrent().catch(console.error));
    document.getElementById("s-export-all").addEventListener("click", () => exportAll().catch(console.error));
    jump.addEventListener("change", () => {
      const i = boards.findIndex((b) => b.dataset.id === jump.value);
      if (i >= 0) openSolo(i);
    });
    window.addEventListener("hashchange", fromHash);
    window.addEventListener("resize", fitBoard);
    window.addEventListener("keydown", (e) => {
      if (e.key === "Escape") { closeSolo(); return; }
      if (!document.body.classList.contains("solo")) return;
      if (e.key === "ArrowRight") openSolo(index + 1);
      if (e.key === "ArrowLeft") openSolo(index - 1);
      if (e.key === "h" || e.key === "H") {
        document.body.classList.toggle("clean");
        fitBoard();
      }
      if (e.key === "e" || e.key === "E") exportCurrent().catch(console.error);
    });
    fromHash();
  </script>
</body>
</html>
